<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 6 - Form Validation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input.invalid, select.invalid {
            border: 2px solid #dc2626;
            background: #fff7f7;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        .success {
            color: #15803d;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #17365d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #24538a;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Activity 6: Form Validation using JavaScript and Regex</p>

        <form id="studentForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="text" id="email" placeholder="example@gmail.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="text" id="phone" placeholder="Enter 10-digit mobile number" maxlength="10">
                <small class="error" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label for="course">Select Course *</label>
                <select id="course">
                    <option value="">-- Select a course --</option>
                    <option value="CSE">Computer Science</option>
                    <option value="AIML">AI and Machine Learning</option>
                    <option value="ECE">Electronics and Communication</option>
                    <option value="ISE">Information Science</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <button type="submit">Submit Registration</button>
            <p id="successMessage" class="success"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById("studentForm");

        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phone");
        const courseInput = document.getElementById("course");

        function showError(input, errorId, message) {
            document.getElementById(errorId).textContent = message;
            input.classList.add("invalid");
        }

        function clearError(input, errorId) {
            document.getElementById(errorId).textContent = "";
            input.classList.remove("invalid");
        }

        function validateName() {
            if (nameInput.value.trim() === "") {
                showError(nameInput, "nameError", "Full name is required.");
                return false;
            }

            clearError(nameInput, "nameError");
            return true;
        }

        function validateEmail() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailInput.value.trim() === "") {
                showError(emailInput, "emailError", "Email is required.");
                return false;
            }

            if (!emailRegex.test(emailInput.value.trim())) {
                showError(emailInput, "emailError", "Enter a valid email address.");
                return false;
            }

            clearError(emailInput, "emailError");
            return true;
        }

        function validatePhone() {
            const phoneRegex = /^[6-9]\d{9}$/;
            const phone = phoneInput.value.trim();

            if (phone === "") {
                showError(phoneInput, "phoneError", "Phone number is required.");
                return false;
            }

            if (!phoneRegex.test(phone)) {
                showError(phoneInput, "phoneError",
                    "Enter a valid 10-digit Indian mobile number.");
                return false;
            }

            clearError(phoneInput, "phoneError");
            return true;
        }

        function validateCourse() {
            if (courseInput.value === "") {
                showError(courseInput, "courseError", "Please select a course.");
                return false;
            }

            clearError(courseInput, "courseError");
            return true;
        }

        nameInput.addEventListener("input", validateName);
        emailInput.addEventListener("input", validateEmail);
        phoneInput.addEventListener("input", validatePhone);
        courseInput.addEventListener("change", validateCourse);

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const isNameValid = validateName();
            const isEmailValid = validateEmail();
            const isPhoneValid = validatePhone();
            const isCourseValid = validateCourse();

            const successMessage = document.getElementById("successMessage");

            if (isNameValid && isEmailValid && isPhoneValid && isCourseValid) {
                successMessage.textContent =
                    "Registration submitted successfully!";
                form.reset();

                clearError(nameInput, "nameError");
                clearError(emailInput, "emailError");
                clearError(phoneInput, "phoneError");
                clearError(courseInput, "courseError");
            } else {
                successMessage.textContent = "";
            }
        });
    </script>
</body>
</html>
